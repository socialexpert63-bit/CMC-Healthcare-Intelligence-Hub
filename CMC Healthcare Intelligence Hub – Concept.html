<style>

.ph{position:relative;overflow:hidden;width:64px;height:64px;background:linear-gradient(135deg,#7fe0d8,#6b9be0)}.ph:before,.ph:after{content:"";position:absolute;background:rgba(255,255,255,.88);border-radius:50%}.ph:before{left:21px;top:12px;width:22px;height:22px}.ph:after{left:10px;top:40px;width:44px;height:40px}

<div class="app"><nav aria-label="Main"><h1><i class="lg">✚</i>CMC Hub<small>Intelligence Hub · Concept</small></h1>

<script>
const $=s=>document.querySelector(s),T=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const D={All:[0,0,0,0],Cardiology:[148,12,9,5],Neurology:[96,8,6,3],Orthopedics:[121,15,7,6],'General Medicine':[210,10,14,4],Diagnostics:[174,18,11,9]};

let LOG=[['LOG-3','AI-04','Monitoring check recorded','Oversight Lead 1','2026-11-09','Reviewed'],['LOG-2','AI-01','Human approval recorded','Oversight Lead 1','2026-11-05','Approved'],['LOG-1','AI-03','Submitted','Owner C','2026-11-02','Pending']];
let F=[['FB-1','Patient A','Cardiology','Waiting Experience',0],['FB-2','Patient B','Neurology','Communication',2],['FB-3','Patient C','Diagnostics','Registration Experience',4]];
const FS=['Feedback Received','Under Review','Assigned','Follow-up Required','Resolution Recorded','Closed'];

const V={
proposal(){const L=(a,b,c)=>`<div class="card svc"><i class="num">0${a}</i><h3>${b}</h3><p class="mut">${c}</p></div>`;return`<section class="hero"><div><div class="eb">Proposal · Concept prototype</div><h1>A hospital platform built for <em>operations, experience and responsible AI.</em></h1><p>Prepared for Edgar G. Chedrawy, Clemenceau Medical Center – Dubai. An independent, interactive concept that connects patient experience, hospital operations, executive analytics and AI governance.</p><button class="p" data-go="website">See the hospital website</button><button class="g2" data-go="overview">Open the live dashboard</button><p style="font-size:12px;opacity:.75">Prepared by: [your name / team]</p></div><div class="vis"><div class="glass" style="left:0;top:10px;position:relative;margin-bottom:14px"><small>Pillar 1</small><br><b>Clinical operations</b></div><div class="glass" style="position:relative;margin-bottom:14px;animation-delay:-2s"><small>Pillar 2</small><br><b>Healthcare leadership analytics</b></div><div class="glass" style="position:relative;animation-delay:-4s"><small>Pillar 3</small><br><b>AI governance and accountability</b></div></div></section>
<section class="sec"><div class="eb">Why this concept</div><h2>More valuable than a standard hospital website</h2><p class="mut" style="max-width:680px">Your profile spans hospital operations, executive visibility and responsible AI adoption. This prototype shows all three working together, so you can react to something tangible rather than a slide.</p></section>
<section class="sec" id="svc"><div class="eb">What is included</div><h2>The platform at a glance</h2><div class="hm">${L(1,'Executive Command Center','Select a department and watch appointments, tasks and feedback update.')}${L(2,'Connected Patient Journey','Request to confirmation, check-in and follow-up, stage by stage.')}${L(3,'Responsible AI Governance Center','Registry, seven-step review, human approval gates and audit trail.')}${L(4,'Patient Experience','Feedback intake and a six-stage service improvement workflow.')}${L(5,'Appointment Management','Searchable requests, status changes and validated booking.')}${L(6,'Patient-facing website','Services, doctor directory and appointment request.')}</div></section>
<section class="sec"><div class="eb">Suggested walkthrough</div><h2>Six screens, in this order</h2><div class="row">${[['Executive dashboard','overview'],['Patient portal','appointments'],['Patient journey','journey'],['AI governance','governance'],['Patient experience','experience']].map((x,i)=>`<button class="chip" data-go="${x[1]}">${i+1}. ${x[0]}</button>`).join('')}</div><p class="mut">Reporting and analytics follow as the sixth screen in the full build.</p></section>
<section class="sec"><div class="eb">How we would work</div><h2>From concept to review</h2><div class="steps">${['Discovery: your priorities','Design: key screens','Build: interactive prototype','Review: your feedback and refinement'].map((s,i)=>`<div class="step ${i<2?'done':i==2?'cur':''}">${s}</div>`).join('')}</div><p class="mut">Timeline and investment to be agreed, so they are intentionally left open here.</p></section>
<section class="sec card"><div class="eb">Clear boundaries</div><h2>What this is, and is not</h2><p>• An independent demonstration, not an official hospital system and not commissioned or approved by Clemenceau Medical Center.</p><p>• All patients, staff, doctors and figures are fictional placeholders; no real records.</p><p>• AI governance is administrative oversight only: no diagnosis, triage or treatment functions.</p><p>• No claimed integrations or certifications.</p></section>
<section class="sec" style="text-align:center"><h2>Ready to explore it?</h2><button class="p" data-go="governance">Start with AI Governance</button></section>`},

<section class="sec" id="svc"><h2>Featured Medical Services</h2><p class="mut">Illustrative categories, not a verified service list. Pick one to filter doctors.</p><div class="hm">${SV.map((s,i)=>`<div class="card svc"><i class="num">0${i+1}</i><h3>${s}</h3><p class="mut">Editable sample description.</p><button data-sv="${s}">Find doctors</button></div>`).join('')}</div></section>
<section class="sec" id="docs"><h2>Find a Doctor</h2><div class="row"><input id="dsq" placeholder="Search doctors" aria-label="Search doctors"></div><div>${['All',...SV].map(s=>`<button class="chip ${s==sp?'on':''}" data-sv="${s}">${s}</button>`).join('')}</div><div class="hm" id="dgrid">${docs()}</div></section>
<section class="sec card" id="book"><h2>Request an Appointment</h2><div class="hm"><div><label>Full name</label><input id="bn" style="width:100%"></div><div><label>Email</label><input id="bm" type="email" style="width:100%"></div><div><label>Department</label><select id="bd" style="width:100%">${SV.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Preferred date</label><input id="bt" type="date" style="width:100%"></div></div><div class="err" id="be"></div><button class="p" id="bk">Submit request</button><div id="bo"></div></section>
<section class="sec" id="portal"><h2>Patient Portal</h2><div class="hm">${['Track appointment requests','Notifications and reminders','Share feedback with Patient Services'].map(t=>`<div class="card"><b>${t}</b><p class="mut">Administrative interactions only, no medical records.</p></div>`).join('')}</div><p><button class="p" data-go="appointments">Try the demo portal</button></p></section>
<section class="sec" id="tech"><h2>Healthcare Technology</h2><div class="hm"><div class="card"><b>Operations visibility</b><p class="mut">Executive dashboards and department activity.</p><button data-go="overview">View</button></div><div class="card"><b>Connected patient journey</b><p class="mut">Request to follow-up, step by step.</p><button data-go="journey">View</button></div><div class="card"><b>Responsible AI governance</b><p class="mut">Human oversight, review and audit trail.</p><button data-go="governance">View</button></div></div></section>
<section class="sec card" id="contact"><h2>Contact and Location</h2><p class="mut">Address, phone and map placeholders. This concept is independent and not operated by Clemenceau Medical Center.</p></section>`},
overview(){const d=D[dept],mx=210;return`<div class="eb">Thursday 12 November 2026 · Demo data</div><h2>Executive Command Center</h2><div class="row"><label for="dp" style="margin:0">Department</label><select id="dp">${Object.keys(D).map(k=>`<option ${k==dept?'selected':''}>${k}</option>`).join('')}</select><span class="mut">Illustrative sample figures</span></div>
<div class="grid">${kpi('Appointments',d[0])}${kpi('Pending admin tasks',d[1])}${kpi('Feedback items',d[2])}${kpi('Open operational issues',d[3])}</div>
<div class="two" style="margin-bottom:14px"><div class="card"><h3>Appointment trend (sample, 7 days)</h3>${line([32,41,38,52,47,60,66])}</div><div class="card"><h3>Request status mix (live from Appointments)</h3>${donut()}</div></div><div class="two"><div class="card"><h3>Department activity (sample)</h3>${Object.keys(D).slice(1).map(k=>`<div class="bar"><span style="width:120px">${k}</span><i data-w="${D[k][0]/mx*70}"></i><span>${D[k][0]}</span></div>`).join('')}</div>

appointments(){const r=A.filter(a=>(a[1]+a[2]+a[0]).toLowerCase().includes(q)&&(!fs||a[4]==fs));return`<h2>Appointment Management</h2><div class="grid">${AS.map(s=>kpi(s,A.filter(a=>a[4]==s).length)).join('')}</div>
<div class="row"><input id="sq" placeholder="Search" aria-label="Search" value="${q}"><select id="sf" aria-label="Status"><option value="">All statuses</option>${AS.map(s=>`<option ${s==fs?'selected':''}>${s}</option>`).join('')}</select><button class="p" id="newA">New request</button></div>
<div class="card wrap"><table><tr><th>Ref</th><th>Patient</th><th>Department</th><th>Date</th><th>Status</th><th>Change</th></tr>${r.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[3]}</td><td><span class="badge ${bc(a[4])}">${a[4]}</span></td><td><select data-id="${a[0]}" aria-label="Change status">${AS.map(s=>`<option ${s==a[4]?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div><p class="mut">Demonstration availability only; not connected to hospital scheduling.</p>`},
journey(){const j=JR[js];return`<h2>Connected Patient Journey</h2><p class="mut">Administrative workflow stages only; not clinical progress.</p><div class="card wrap"><table><tr><th>Ref</th><th>Patient</th><th>Department</th><th>Stage</th><th>Coordinator</th></tr>${JR.map((x,i)=>`<tr class="click" data-j="${i}" ${i==js?'style="background:rgba(15,157,154,.1)"':''}><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${J[x[3]]}</td><td>${x[4]}</td></tr>`).join('')}</table></div>
<div class="card" style="margin-top:14px"><h3>${j[0]} · ${j[1]}</h3><div class="steps">${J.map((s,i)=>`<div class="step ${i<j[3]?'done':i==j[3]?'cur':''}">${s}</div>`).join('')}</div>
<div class="row"><button class="p" id="adv" ${j[3]==6?'disabled':''}>Advance stage</button>${['Send reminder','Notify coordinator','Flag missing info','Request feedback','Create follow-up task'].map(a=>`<button data-sim="${a}">${a}</button>`).join('')}</div><p class="mut">Actions are simulated; nothing is sent.</p></div>`},
governance(){const a=AI[gs];return`<h2>Responsible AI Governance Center</h2><p class="mut">Administrative oversight only. No diagnosis, triage, or treatment functions. All use cases are proposed demonstrations, not deployed systems.</p>
<div class="grid">${kpi('Registered initiatives',AI.length)}${kpi('Pending reviews',AI.filter(x=>x[5]<4).length)}${kpi('Approved for demo',AI.filter(x=>x[5]>=4).length)}${kpi('No oversight owner',AI.filter(x=>!x[4]).length)}${kpi('Audit records',LOG.length)}</div>
<div class="card wrap"><table><tr><th>ID</th><th>Use case</th><th>Department</th><th>Human oversight</th><th>Status</th></tr>${AI.map((x,i)=>`<tr class="click" data-g="${i}"><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[4]||'<span class="badge b">Not assigned</span>'}</td><td><span class="badge ${bc(aiStatus(x[5]))}">${aiStatus(x[5])}</span></td></tr>`).join('')}</table></div>
<div class="card" style="margin-top:14px"><h3>${a[0]} · ${a[1]}</h3><div class="steps">${G.map((s,i)=>`<div class="step ${i<a[5]?'done':i==a[5]?'cur':''}">${s}</div>`).join('')}</div>
<div class="row"><button class="p" id="gadv">Record human approval and advance</button><button id="gown">Assign oversight owner</button></div><p class="mut">Advancing requires a named human oversight owner and writes to the audit log.</p></div>
<div class="card wrap" style="margin-top:14px"><h3>Audit log</h3><table><tr><th>ID</th><th>Initiative</th><th>Activity</th><th>User</th><th>Date</th><th>Status</th></tr>${LOG.map(l=>`<tr>${l.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`},
experience(){return`<h2>Patient Experience</h2><p class="mut">Synthetic feedback and sample figures only.</p><div class="grid">${kpi('Feedback received',F.length)}${kpi('Pending reviews',F.filter(f=>f[4]<4).length)}${kpi('Resolved',F.filter(f=>f[4]>=4).length)}</div><div class="row"><button class="p" id="newF">Add feedback</button></div>
<div class="card wrap"><table><tr><th>ID</th><th>Patient</th><th>Department</th><th>Category</th><th>Workflow stage</th><th></th></tr>${F.map((f,i)=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td><td><span class="badge ${bc(FS[f[4]])}">${FS[f[4]]}</span></td><td><button data-f="${i}" ${f[4]==5?'disabled':''}>Next stage</button></td></tr>`).join('')}</table></div>`}};
function go(v){history.replaceState(0,'','#'+v);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));$('#v').innerHTML=V[v]();counter()}
const cur=()=>location.hash.slice(1)||'website',R=()=>go(cur());
function form(title,html,ok){const d=$('#dlg');d.innerHTML=`<form method="dialog" novalidate><h3>${title}</h3>${html}<div class="err" id="er"></div><div class="row"><button class="p" id="sv" type="button">Submit</button><button value="x">Cancel</button></div></form>`;d.showModal();$('#sv').onclick=()=>{const r=ok(d);if(r)$('#er').textContent=r;else{d.close();R()}}}
document.addEventListener('click',e=>{const t=e.target;
if(t.closest('nav a'))go(t.closest('nav a').dataset.v);
if(t.dataset.go)go(t.dataset.go);
if(t.dataset.sc)document.getElementById(t.dataset.sc).scrollIntoView({behavior:'smooth'});
if(t.dataset.sv){sp=t.dataset.sv;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.sv==sp));$('#dgrid').innerHTML=docs();document.getElementById('docs').scrollIntoView({behavior:'smooth'})}
if(t.dataset.rq){$('#bd').value=t.dataset.rq;document.getElementById('book').scrollIntoView({behavior:'smooth'})}
if(t.id=='bk'){const n=$('#bn').value.trim();$('#be').textContent=!n?'Name is required.':!/^\S+@\S+\.\S+$/.test($('#bm').value)?'Enter a valid email.':!$('#bt').value?'Choose a date.':'';if(!$('#be').textContent){A.unshift(['APT-'+(1006+A.length),n,$('#bd').value,$('#bt').value,'New Request']);$('#bo').innerHTML='<div class="ok">Request received (demo). It now appears in the dashboard Appointments table.</div>';T('Request created (demo)')}}
if(t.id=='newA')form('New appointment request (demo)',`<label>Patient name</label><input id="n"><label>Email</label><input id="m" type="email"><label>Department</label><select id="d">${Object.keys(D).slice(1).map(k=>`<option>${k}</option>`).join('')}</select><label>Preferred date</label><input id="dt" type="date">`,()=>{if(!$('#n').value.trim())return'Name is required.';if(!/^\S+@\S+\.\S+$/.test($('#m').value))return'Enter a valid email.';if(!$('#dt').value)return'Choose a date.';A.unshift(['APT-'+(1006+A.length),$('#n').value.trim(),$('#d').value,$('#dt').value,'New Request']);T('Request created (demo)')});
if(t.id=='newF')form('Add synthetic feedback',`<label>Category</label><select id="c"><option>Appointment Experience</option><option>Communication</option><option>Waiting Experience</option></select><label>Department</label><select id="d">${Object.keys(D).slice(1).map(k=>`<option>${k}</option>`).join('')}</select>`,()=>{F.unshift(['FB-'+(F.length+1),'Patient X',$('#d').value,$('#c').value,0]);T('Feedback added')});
if(t.closest('[data-j]')){js=+t.closest('[data-j]').dataset.j;R()}
if(t.id=='adv'){JR[js][3]++;T('Stage advanced: '+J[JR[js][3]]);R()}
if(t.dataset.sim)T('Simulated: '+t.dataset.sim);
if(t.closest('[data-g]')){gs=+t.closest('[data-g]').dataset.g;R()}
if(t.id=='gown'){AI[gs][4]='Oversight Lead 1';LOG.unshift(['LOG-'+(LOG.length+1),AI[gs][0],'Oversight owner assigned','Platform Admin','2026-11-12','Recorded']);T('Owner assigned');R()}
if(t.id=='gadv'){if(!AI[gs][4])return T('Blocked: assign a human oversight owner first');if(AI[gs][5]>=6)return T('Already at final stage');AI[gs][5]++;LOG.unshift(['LOG-'+(LOG.length+1),AI[gs][0],G[AI[gs][5]],AI[gs][4],'2026-11-12','Approved']);T('Advanced to '+G[AI[gs][5]]);R()}
if(t.dataset.f){F[+t.dataset.f][4]++;R()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='dp'){dept=t.value;R()}if(t.id=='sf'){fs=t.value;R()}if(t.dataset.id){A.find(a=>a[0]==t.dataset.id)[4]=t.value;T('Status updated');R()}});
document.addEventListener('input',e=>{if(e.target.id=='dsq'){dq=e.target.value.toLowerCase();$('#dgrid').innerHTML=docs()}if(e.target.id=='sq'){q=e.target.value.toLowerCase();const p=e.target.selectionStart;R();const i=$('#sq');i.focus();i.setSelectionRange(p,p)}});
window.onhashchange=R;R();
